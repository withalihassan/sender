<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>2Captcha Image Solver</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      color: #1f2328;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #57606a;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 8px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button {
      background: #0969da;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #0757ba;
    }
    button.secondary {
      background: #f6f8fa;
      color: #1f2328;
      border: 1px solid #d0d7de;
    }
    button.secondary:hover {
      background: #eaeef2;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      min-height: 14px;
      color: #1a7f37;
    }
    #status.error {
      color: #cf222e;
    }
    .hint {
      font-size: 11.5px;
      color: #57606a;
      line-height: 1.5;
      margin-top: 12px;
      border-top: 1px solid #eaeef2;
      padding-top: 10px;
    }
    .hint code {
      background: #f6f8fa;
      padding: 1px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>2Captcha Image Solver</h1>
  <label for="apiKey">2Captcha API key</label>
  <div class="row">
    <input id="apiKey" type="password" placeholder="Paste your API key" />
    <button class="secondary" id="toggle" type="button" title="Show/hide">👁</button>
  </div>
  <div class="row">
    <button id="save" type="button">Save</button>
    <button class="secondary" id="test" type="button">Test key</button>
  </div>
  <div id="status"></div>
  <div class="hint">
    Right-click any image on a page and choose <b>"Solve Captcha (2Captcha)"</b>. A popup will
    show the result with a <code>📋</code> copy button.
  </div>
  <script src="popup.js"></script>
</body>
</html>
